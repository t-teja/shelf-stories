name: Decode README screenshots
on:
  push:
    paths:
      - 'docs/screenshots/*.b64'
      - 'docs/screenshots/*.b64.*'
      - '.github/workflows/decode-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode .b64 to .jpg
        run: |
          set -euo pipefail
          decode_one() {
            local name="$1" expected="$2"
            local parts
            mapfile -t parts < <(ls docs/screenshots/${name}.b64.* 2>/dev/null | sort -V || true)
            if [ "${#parts[@]}" -eq "$expected" ]; then
              cat "${parts[@]}" > "docs/screenshots/${name}.b64"
              echo "assembled ${name}.b64 from ${expected} parts ($(wc -c < docs/screenshots/${name}.b64) bytes)"
              rm -f "${parts[@]}"
            elif [ "${#parts[@]}" -gt 0 ]; then
              echo "skipping ${name}: have ${#parts[@]}/${expected} parts (wait for all)"
            fi
            if [ -f "docs/screenshots/${name}.b64" ]; then
              base64 -d "docs/screenshots/${name}.b64" > "docs/screenshots/${name}.jpg"
              local sz
              sz=$(wc -c < "docs/screenshots/${name}.jpg")
              echo "decoded ${name}.jpg (${sz} bytes)"
              if [ "$sz" -lt 20000 ]; then
                echo "ERROR: ${name}.jpg too small (${sz}); refusing commit"
                rm -f "docs/screenshots/${name}.jpg"
                exit 1
              fi
              rm -f "docs/screenshots/${name}.b64"
            fi
          }
          decode_one showcase 12
          decode_one collection 12
          decode_one paddock 14
          rm -f docs/screenshots/pixel.jpg docs/screenshots/*.svg || true
      - name: Commit JPEGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.jpg || true
          git add -u docs/screenshots || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "docs: decode README screenshot JPEGs"
          git push
